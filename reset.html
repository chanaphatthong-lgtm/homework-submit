<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <title>แผงควบคุม Admin - ครูเกมส์</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { font-family: 'DM Sans', sans-serif; max-width: 100vw; overflow-x: hidden; margin: 0; min-height: 100vh; }
    
    /* 🌸 พื้นหลังสมูท 60FPS แบบเดียวกับ game.html */
    body { background: linear-gradient(-45deg, #fce7f3, #fdf2f8, #ffe4e6, #fff1f2); background-size: 400% 400%; animation: gradientBG 12s ease infinite; }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .btn-tactile { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .btn-tactile:hover { transform: scale(1.03); filter: brightness(1.03); }
    .btn-tactile:active { transform: scale(0.97) translateY(2px); }
    
    .game-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(236, 72, 153, 0.10); border: 1px solid rgba(255, 255, 255, 0.8); }
    .font-cute { font-family: 'Fredoka', sans-serif; }
  </style>
</head>
<body class="text-gray-800 flex flex-col items-center justify-center p-5 min-h-screen">

  <main class="w-full max-w-md mx-auto my-auto">
    <div class="game-card rounded-[2rem] p-6 text-center relative overflow-hidden flex flex-col items-center">
      
      <!-- Icon -->
      <div class="bg-pink-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner text-4xl">
        ⚙️
      </div>

      <h1 class="text-2xl font-bold text-gray-800 mb-1">แผงควบคุมของครู</h1>
      <p class="text-xs text-gray-500 mb-6">จัดการระบบคะแนน และรีเซ็ตข้อมูลภายในเครื่องนี้</p>

      <!-- Dashboard แสดงสถานะปัจจุบัน -->
      <div class="w-full bg-white/70 backdrop-blur-md rounded-2xl p-4 border border-pink-100 shadow-sm mb-6 text-left">
        <h3 class="text-xs font-bold text-pink-500 uppercase tracking-wider mb-2">📊 สถานะปัจจุบันในเครื่องนี้</h3>
        <div class="text-xs text-gray-600 space-y-1.5">
          <div class="flex justify-between border-b border-gray-100 pb-1">
            <span>ผู้เล่นที่มีคะแนนบนตาราง:</span>
            <span id="stat-player-count" class="font-bold text-gray-800">0 คน</span>
          </div>
          <div class="flex justify-between border-b border-gray-100 pb-1">
            <span>หัวใจคงเหลือ:</span>
            <span id="stat-heart-count" class="font-bold text-red-500">5 / 5 ดวง</span>
          </div>
          <div class="flex justify-between">
            <span>รีเซ็ตสัปดาห์ล่าสุด:</span>
            <span id="stat-last-reset" class="font-bold text-gray-800">-</span>
          </div>
        </div>
      </div>

      <!-- ปุ่มดำเนินการต่างๆ -->
      <div class="w-full space-y-3">
        <!-- 1. ล้างคะแนนประจำสัปดาห์ -->
        <button onclick="forceResetLeaderboard()" class="btn-tactile w-full bg-gradient-to-r from-red-400 to-rose-500 text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-red-200/50 border border-red-300 flex items-center justify-center gap-2">
          <span>🏆</span>
          <span>ล้างคะแนนประจำสัปดาห์</span>
        </button>

        <!-- 2. เติมหัวใจเต็ม 5 ดวง -->
        <button onclick="resetHearts()" class="btn-tactile w-full bg-gradient-to-r from-pink-400 to-pink-500 text-white font-bold py-3 px-4 rounded-2xl shadow-md shadow-pink-200 border border-pink-300 flex items-center justify-center gap-2">
          <span>❤️</span>
          <span>เติมหัวใจเต็ม 5 ดวงทันที</span>
        </button>

        <!-- 3. ล้างข้อมูลทั้งหมดในเครื่อง -->
        <button onclick="clearAllData()" class="btn-tactile w-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-semibold py-2.5 px-4 rounded-2xl border border-gray-200 text-xs flex items-center justify-center gap-1.5">
          <span>🧹</span>
          <span>ล้างข้อมูลทั้งหมดในเครื่อง (Clear Storage)</span>
        </button>
      </div>

      <!-- ปุ่มย้อนกลับ -->
      <a href="game.html" class="btn-tactile inline-flex items-center gap-1.5 mt-6 text-pink-500 text-sm font-semibold hover:text-pink-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" /></svg>
        กลับไปหน้าเล่นเกม
      </a>

    </div>
  </main>

  <script>
    // อัปเดตสถานะขึ้นหน้าจอ
    function updateStatus() {
      // 1. อ่านจำนวนผู้เล่นในกระดาน
      const rawBoard = localStorage.getItem('krugames_realtime_leaderboard');
      let board = rawBoard ? JSON.parse(rawBoard) : [];
      document.getElementById('stat-player-count').innerText = `${board.length} คน`;

      // 2. อ่านหัวใจ
      const hearts = localStorage.getItem('krugames_hearts') || '5';
      document.getElementById('stat-heart-count').innerText = `${hearts} / 5 ดวง`;

      // 3. อ่านเวลารีเซ็ตล่าสุด
      const lastReset = localStorage.getItem('krugames_leaderboard_lastreset');
      if (lastReset) {
        const d = new Date(parseInt(lastReset));
        document.getElementById('stat-last-reset').innerText = d.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' });
      } else {
        document.getElementById('stat-last-reset').innerText = 'ยังไม่เคยรีเซ็ต';
      }
    }

    // ฟังก์ชันรีเซ็ตคะแนนตารางอันดับ
    function forceResetLeaderboard() {
      const confirmReset = confirm("คุณครูแน่ใจหรือไม่ที่จะล้างคะแนนของเด็กๆ ทั้งหมด?\n(การกระทำนี้ไม่สามารถกู้คืนได้)");
      
      if (confirmReset) {
        // เขียนทับด้วย array เปล่า [] เพื่อล้างข้อมูลบนหน้า game.html ทันที
        localStorage.setItem('krugames_realtime_leaderboard', JSON.stringify([]));
        localStorage.setItem('krugames_leaderboard_lastreset', Date.now().toString());
        
        updateStatus();
        alert("✨ รีเซ็ตกระดานคะแนนและเริ่มนับสัปดาห์ใหม่เรียบร้อยแล้ว!");
      }
    }

    // ฟังก์ชันเติมหัวใจเต็ม
    function resetHearts() {
      localStorage.setItem('krugames_hearts', '5');
      localStorage.removeItem('krugames_hearts_timestamp');
      updateStatus();
      alert("❤️ เติมหัวใจเต็ม 5 ดวงเรียบร้อยแล้วครับ!");
    }

    // ฟังก์ชันล้าง LocalStorage ทั้งหมด
    function clearAllData() {
      const confirmClear = confirm("⚠️ คำเตือน: การล้างข้อมูลทั้งหมดจะลบทั้งคะแนน หัวใจ และข้อมูลนักเรียนที่เข้าสู่ระบบไว้ในเครื่องนี้\nคุณครูต้องการดำเนินการต่อหรือไม่?");
      if (confirmClear) {
        localStorage.clear();
        updateStatus();
        alert("🧹 ล้างข้อมูลทั้งหมดเรียบร้อยแล้ว!");
      }
    }

    window.onload = function() {
      updateStatus();
    };
  </script>
</body>
</html>
